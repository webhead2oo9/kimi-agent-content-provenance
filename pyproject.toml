[project]
name = "kimi-agent-content-provenance"
version = "0.2.0"
description = "Searchable OpenAI image and audio provenance checks for Kimi"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "webhead2oo9" }]
dependencies = ["kimi-agent-module-api>=2.2,<3", "httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = ["kimi-agent-module-api[testing]>=2.2,<3", "mypy", "pytest", "pytest-asyncio", "ruff", "twine"]

[project.entry-points."kimi_agent.modules"]
content_provenance = "kimi_agent_content_provenance:SPEC"

[project.urls]
Repository = "https://github.com/webhead2oo9/kimi-agent-content-provenance"
Issues = "https://github.com/webhead2oo9/kimi-agent-content-provenance/issues"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kimi_agent_content_provenance = ["py.typed"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/tests"
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC", "G", "LOG"]

# Pin the matching SDK while API 2.2 is under review; wheel metadata keeps >=2.2,<3.
[tool.uv.sources]
kimi-agent-module-api = { git = "https://github.com/webhead2oo9/kimi-agent.git", rev = "2fcba7ca31ca9daf634ffd84744c900b731d8f4c", subdirectory = "bot/packages/kimi-agent-module-api" }
